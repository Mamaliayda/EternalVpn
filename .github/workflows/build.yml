name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK env
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
            if [ -n "$SDKMANAGER" ]; then
              export PATH="$(dirname "$SDKMANAGER"):$PATH"
              echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
            fi
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download large binaries
        run: bash scripts/setup.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee build-test.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternalvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            build-test.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

      - name: Post build log comment on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -200 build-test.log > build-test-tail.log || true
          {
            echo "CI build failed for ${{ github.sha }}"
            echo
            echo '```'
            cat build-test-tail.log
            echo '```'
          } > build-test-comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@build-test-comment.md || true
